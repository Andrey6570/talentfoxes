name: Functions logs (diagnostics)

# Prints the latest Cloud Functions log lines and the function service account's roles, to debug push delivery.
# Reads only; uses the same FIREBASE_SERVICE_ACCOUNT secret as the deploy.
on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Functions and their service account
        run: |
          gcloud functions list --project talent-foxes --format="table(name,state,environment,serviceConfig.serviceAccountEmail)" || true

      - name: Roles of the service accounts that run the functions
        run: |
          NUM=$(gcloud projects describe talent-foxes --format="value(projectNumber)")
          echo "project number: $NUM"
          gcloud projects get-iam-policy talent-foxes --flatten="bindings[].members" \
            --filter="bindings.members:${NUM}-compute@developer.gserviceaccount.com OR bindings.members:talent-foxes@appspot.gserviceaccount.com" \
            --format="table(bindings.role,bindings.members)" || true

      - name: Latest function log lines (warnings and errors first)
        run: |
          echo "=== warnings and errors, last 3 days"
          gcloud logging read 'resource.type="cloud_run_revision" AND severity>=WARNING' --project talent-foxes --freshness=3d --limit=40 \
            --format="value(timestamp,resource.labels.service_name,severity,textPayload,jsonPayload.message)" || true
          echo "=== all lines, last 1 day"
          gcloud logging read 'resource.type="cloud_run_revision"' --project talent-foxes --freshness=1d --limit=60 \
            --format="value(timestamp,resource.labels.service_name,severity,textPayload,jsonPayload.message)" || true

      - name: Registered push devices (no tokens shown)
        run: |
          TOKEN=$(gcloud auth print-access-token)
          curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "https://firestore.googleapis.com/v1/projects/talent-foxes/databases/(default)/documents:runQuery" \
            -d '{"structuredQuery":{"from":[{"collectionId":"devices","allDescendants":true}],"limit":50}}' \
            | python3 -c 'import json,sys
          rows=[r for r in json.load(sys.stdin) if "document" in r]
          print(len(rows), "device document(s)")
          for r in rows:
              f=r["document"]["fields"]; g=lambda k:list(f.get(k,{}).values())[0] if k in f else "-"
              print(r["document"]["name"].split("/documents/")[1].rsplit("/",1)[0], "| role", g("role"), "| platform", g("platform"), "| lang", g("lang"), "| updatedAt", g("updatedAt"), "| has token", "token" in f)'

      - name: Families overview (names, number of parents, invite link)
        run: |
          TOKEN=$(gcloud auth print-access-token)
          BASE="https://firestore.googleapis.com/v1/projects/talent-foxes/databases/(default)/documents"
          curl -s -H "Authorization: Bearer $TOKEN" "$BASE/families?pageSize=50" > fam.json
          curl -s -H "Authorization: Bearer $TOKEN" "$BASE/invites?pageSize=50" > inv.json
          python3 - <<'PY'
          import json
          fams=json.load(open("fam.json")).get("documents",[]); invs=json.load(open("inv.json")).get("documents",[])
          inv={d["name"].rsplit("/",1)[1]: d["fields"].get("fid",{}).get("stringValue") for d in invs}
          print(len(fams),"family(ies),",len(invs),"invite(s)")
          for d in fams:
              f=d["fields"]; fid=d["name"].rsplit("/",1)[1]
              uids=[v.get("stringValue") for v in f.get("parentUids",{}).get("arrayValue",{}).get("values",[])]
              code=f.get("inviteCode",{}).get("stringValue","")
              print(fid[:6]+"…", "| name", f.get("name",{}).get("stringValue"), "| parents", len(uids), "| uids", [u[:5]+"…" for u in uids],
                    "| invite doc points here", inv.get(code)==fid, "| has joinProof", "joinProof" in f)
          PY
