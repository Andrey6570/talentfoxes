name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image already ships the Android SDK; only the licences need accepting so Gradle can fetch platform packages.
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync into the Android project
        run: |
          npx vite build
          npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > android/app/talentfoxes.jks; fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -f app/talentfoxes.jks ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: talent-foxes-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish the APK as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/*/*.apk | head -1)
          cp "$APK" talent-foxes.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest talent-foxes.apk \
            --title "Talent Foxes, сборка №${GITHUB_RUN_NUMBER}" \
            --notes "Сборка из коммита ${GITHUB_SHA::7}. Скачайте talent-foxes.apk и установите." \
            --target "$GITHUB_SHA"
