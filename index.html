<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5B3DF5">
  <title>Talent Foxes</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Noto+Sans:wght@500;700&display=swap">
</head>
<body>
  <div id="app">
    <header class="top" id="hdr">
      <span class="chip" id="whoChip" hidden></span>
      <span class="chip" id="hdrStars" hidden></span>
      <span class="grow"></span>
      <button class="chip" id="setBtn" data-act="openSettings"></button>
    </header>
    <main id="view"></main>
    <div class="sync" id="sync"></div>
  </div>
  <div class="sheet" id="sheet" hidden></div>
  <div class="sheet hello" id="hello" hidden></div>
  <nav class="tabs" id="tabsNav" hidden><div class="in" id="tabs"></div></nav>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
